name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # MDQuickViewer 用 MSYS2 UCRT64 工具链（gcc + windres）
      # windres 由 mingw-w64-ucrt-x86_64-binutils 提供，没有独立的 windres 包。
      - name: 安装 MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-binutils

      - name: 构建并运行自检
        shell: msys2 {0}
        working-directory: MDQuickViewer
        run: |
          export PATH="/ucrt64/bin:$PATH"
          gcc --version | head -1
          ./build.sh test

      # 把导入表落成文本文件随 artifact 一起上传。
      # 这样 release job 不需要再配置 MSVC/MinGW 工具链去跑 dumpbin/objdump
      # —— 之前把 dumpbin 放在 release job 里，那台 runner 上根本没配 MSVC 环境，
      # 命令找不到必定失败。objdump 由上面已装的 binutils 提供。
      - name: 记录导入表
        shell: msys2 {0}
        working-directory: MDQuickViewer
        run: |
          export PATH="/ucrt64/bin:$PATH"
          # objdump -p 会在 Import / Delay Import / Bound Import 等多张表里
          # 重复打印同一个 DLL 名，所以要 sort -u 去重。
          objdump -p build/MDQuickViewer.exe \
            | sed -n 's/^[[:space:]]*DLL Name:[[:space:]]*//p' \
            | tr 'A-Z' 'a-z' | sort -u > build/deps-mingw64.txt
          echo "=== mingw64 导入表 ==="
          cat build/deps-mingw64.txt
          echo "共 $(wc -l < build/deps-mingw64.txt) 个 DLL"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: MDQuickViewer-mingw64
          path: |
            MDQuickViewer/build/MDQuickViewer.exe
            MDQuickViewer/build/sample.md
            MDQuickViewer/build/deps-mingw64.txt
          if-no-files-found: error

  # MSVC + 静态 CRT（/MT）构建，产出 Release 里的"零 CRT 依赖"版本。
  # 既然是对外发布的可选二进制，就不能允许静默失败——release job 依赖它，
  # 这里失败会直接拦住 Release，避免只发一个版本。
  # 注意：Win32 系统 DLL（kernel32/user32/gdi32/comctl32/...）**无法**静态链接，
  # 微软不提供它们的静态库；/MT 只能把 C 运行时静态进 exe。
  msvc:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: 配置 MSVC 环境
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          # 把 cl/link/lib/rc/dumpbin 写进 GITHUB_PATH，后续 step 直接可用
          # （不指定 script 时该 action 会自动导出工具链环境）

      - name: 编译资源（rc.exe）
        shell: pwsh
        run: |
          cd MDQuickViewer
          New-Item -ItemType Directory -Force -Path build | Out-Null
          rc /nologo /fo build\mdqv.res resources\mdqv.rc

      - name: 编译（/MT 静态 CRT）
        shell: pwsh
        working-directory: MDQuickViewer
        run: |
          cl /nologo /W3 /O2 /std:c11 /MT /GS /DUNICODE /D_UNICODE `
            /D_CRT_SECURE_NO_WARNINGS /DWIN32_LEAN_AND_MEAN `
            /Fo:build\ /Fe:build\MDQuickViewer-msvc.exe `
            src\main.c src\win32.c src\markdown.c src\markdown_test.c `
            src\highlight.c src\highlight_test.c src\render.c src\render_test.c `
            src\settings.c src\dlg.c src\ui.c src\cjk_path_test.c `
            build\mdqv.res `
            /link /SUBSYSTEM:WINDOWS /ENTRY:wWinMainCRTStartup `
            comctl32.lib gdi32.lib user32.lib shell32.lib shlwapi.lib comdlg32.lib ole32.lib uuid.lib advapi32.lib

      # dumpbin 只在这个 job 用（MSVC 环境已配好），结果落盘给 release job 读。
      - name: 验证导入表（静态 CRT 应无 api-ms-win-crt-*）
        shell: pwsh
        run: |
          $exe = "MDQuickViewer\build\MDQuickViewer-msvc.exe"
          if (-not (Test-Path $exe)) { throw "未生成 $exe" }
          $dump = & dumpbin /nologo /dependents $exe
          $dump | Write-Host
          # dumpbin /dependents 的依赖清单形如 "    KERNEL32.dll"（缩进 + 文件名）。
          # 结尾留 \r? 兜底：原生命令输出在某些 shell 下可能残留回车。
          $dlls = @($dump | Select-String '^\s+\S+\.dll\r?\s*$' |
                    ForEach-Object { $_.Line.Trim().ToLower() } | Sort-Object -Unique)
          $dlls | Set-Content -Path "MDQuickViewer\build\deps-msvc.txt" -Encoding UTF8
          $crt = @($dlls | Where-Object { $_ -like 'api-ms-win-crt*' -or $_ -like '*vcruntime*' -or $_ -like '*ucrtbase*' })
          if ($crt.Count -ne 0) {
            throw "仍有 CRT 动态依赖（/MT 未生效）: $($crt -join ', ')"
          }
          "OK: 无 CRT 动态依赖（/MT 静态链接生效），共 $($dlls.Count) 个 Win32 系统 DLL" | Out-Host
          # Win32 系统 DLL 必然还在，这是预期行为（无法静态链接）
          Get-Item $exe | Select-Object Name, Length

      - name: 上传 MSVC 产物
        uses: actions/upload-artifact@v4
        with:
          name: MDQuickViewer-msvc
          path: |
            MDQuickViewer/build/MDQuickViewer-msvc.exe
            MDQuickViewer/build/deps-msvc.txt
          if-no-files-found: error

  # 每次 main 分支更新自动发一个 Release（含 mingw64 与 msvc 两个可选版本）
  release:
    needs: [build, msvc]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      # 版本号要从远端已有的 v0.N 推导，所以这里需要仓库上下文。
      # 之前这个 job 直接从「下载产物」开始（不需要代码），加了
      # `git ls-remote origin` 后才发现非 git 目录下会 fatal。
      - uses: actions/checkout@v4
        with:
          # 拉完整历史与全部 tag，方便本地/日志里核对版本号推导
          fetch-depth: 0

      - name: 计算下一个版本号
        id: ver
        shell: pwsh
        run: |
          # 版本号策略：两段式 v0.N，每次 main 推送自动 +1。
          # 只匹配 ^v\d+\.\d+$ 的 tag —— 早期用过的 v<完整SHA> 滚动 tag
          # 不符合该正则，会被自然忽略（那批已清理掉）。
          $remote = git ls-remote --tags --refs origin
          if ($LASTEXITCODE -ne 0) {
            throw "git ls-remote 失败（exit=$LASTEXITCODE），无法读取远端 tag"
          }
          $tags = @($remote |
            ForEach-Object { ($_ -split '\s+')[1] -replace '^refs/tags/', '' } |
            Where-Object { $_ -match '^v\d+\.\d+$' })
          "已存在的版本 tag: $($tags -join ', ')" | Out-Host

          # 取最大的次版本号；一个都没有时从 1 开始（即 v0.1）。
          $max = -1
          foreach ($t in $tags) {
            $minor = [int]($t -replace '^v\d+\.', '')
            if ($minor -gt $max) { $max = $minor }
          }
          $next = if ($max -lt 0) { 1 } else { $max + 1 }
          $tag = "v0.$next"
          "下一个版本号: $tag" | Out-Host
          "tag=$tag"  | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "name=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      # 直接复用 build / msvc 两个 job 的产物，不重复构建
      - name: 下载 mingw64 产物
        uses: actions/download-artifact@v4
        with:
          name: MDQuickViewer-mingw64
          path: dist-mingw64

      - name: 下载 msvc 产物
        uses: actions/download-artifact@v4
        with:
          name: MDQuickViewer-msvc
          path: dist-msvc

      - name: 准备两个版本的目录
        shell: pwsh
        run: |
          # mingw64 版
          New-Item -ItemType Directory -Force -Path pkg\mingw64 | Out-Null
          Copy-Item dist-mingw64\MDQuickViewer.exe   pkg\mingw64\
          Copy-Item dist-mingw64\sample.md           pkg\mingw64\
          # msvc 版：把 exe 改名，避免两个版本同名混淆
          New-Item -ItemType Directory -Force -Path pkg\msvc | Out-Null
          Copy-Item dist-msvc\MDQuickViewer-msvc.exe pkg\msvc\MDQuickViewer.exe
          Copy-Item dist-mingw64\sample.md           pkg\msvc\
          Get-ChildItem -Recurse pkg | Select-Object FullName, Length

      - name: 打包两个 zip
        shell: pwsh
        run: |
          Compress-Archive -Force `
            -Path pkg\mingw64\* `
            -DestinationPath MDQuickViewer-mingw64-x64.zip
          Compress-Archive -Force `
            -Path pkg\msvc\* `
            -DestinationPath MDQuickViewer-msvc-x64.zip
          Get-ChildItem *.zip | Select-Object Name, Length

      - name: 生成 Release 说明
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.ver.outputs.tag }}
        run: |
          # 导入表由各构建 job 用 dumpbin / objdump 落盘，这里只读文本文件，
          # 本 job 不需要任何编译工具链。
          "本次发布的版本号: $env:RELEASE_TAG" | Out-Host
          if (-not $env:RELEASE_TAG) { throw "RELEASE_TAG 为空，上一步的版本号计算没成功？" }
          $mgDlls = @(Get-Content dist-mingw64\deps-mingw64.txt | Where-Object { $_.Trim() })
          $msDlls = @(Get-Content dist-msvc\deps-msvc.txt       | Where-Object { $_.Trim() })
          if ($mgDlls.Count -eq 0) { throw "mingw64 导入表为空，deps-mingw64.txt 没生成？" }
          if ($msDlls.Count -eq 0) { throw "msvc 导入表为空，deps-msvc.txt 没生成？" }
          "=== mingw64 导入表 ($($mgDlls.Count)) ===" | Out-Host
          $mgDlls | Out-Host
          "=== msvc 导入表 ($($msDlls.Count)) ===" | Out-Host
          $msDlls | Out-Host
          $msCrt = @($msDlls | Where-Object { $_ -like 'api-ms-win-crt*' }).Count
          "msvc 版 CRT 动态依赖数: $msCrt" | Out-Host
          if ($msCrt -ne 0) { throw "msvc 版仍有 $msCrt 个 CRT 动态依赖，/MT 静态链接没生效" }
          "OK: msvc 版零 CRT 动态依赖" | Out-Host

          # 单引号 here-string：不插值、反引号安全（markdown 里的 ` 不会被当转义符）。
          # 注意结束标记 '@ 必须单独占行且位于行首（YAML 块标量会剥掉公共缩进）。
          $body = @'
          ## MDQuickViewer __TAG__

          纯 C + Win32 API 的原生 Markdown 浏览器，单文件 exe，**无需附带任何 DLL**。

          - 解析 / 语法着色 / GDI 排版绘制全部手写，不依赖 WebView、Electron 或任何第三方框架
          - GFM：表格、任务列表、删除线、代码块多语言着色
          - 源码纯 C11（无 GCC 扩展），可用 MSVC 或 MinGW-w64 编译
          - 自检 466 项（解析 96 / 着色 62 / 渲染 280 / 中文路径 28）

          ### 下载（二选一，功能完全相同）

          | 版本 | 导入表 | 工具链 |
          | --- | --- | --- |
          | `MDQuickViewer-mingw64-x64.zip` | __MGDLL__ 个 DLL | MinGW-w64 UCRT64（gcc）。**与仓库里 `./build.sh` 的产物完全一致**，适合绝大多数用户 |
          | `MDQuickViewer-msvc-x64.zip` | __MSDLL__ 个 DLL，**0 个 CRT 依赖** | MSVC `/MT`，CRT 已静态链入。**导入表最干净**，适合对运行时依赖敏感的场景 |

          两种版本都只依赖 Windows 自带组件，解压后把 `.md` 文件拖到
          `MDQuickViewer.exe` 上即可打开（也支持命令行传参）。

          > 两者唯一区别是 C 运行时的链接方式。Win32 系统 DLL（kernel32 / user32 /
          > gdi32 / comctl32 / comdlg32 / shell32 / ole32 / advapi32）**无法**静态
          > 链接——微软不提供它们的静态库，这是操作系统接口的本质。

          本次构建的导入表：

          ```
          mingw64:
          __MGLIST__

          msvc:
          __MSLIST__
          ```
          '@
          $body = $body.Replace('__TAG__',    "$env:RELEASE_TAG")
          $body = $body.Replace('__MGDLL__',  "$($mgDlls.Count)")
          $body = $body.Replace('__MSDLL__',  "$($msDlls.Count)")
          $body = $body.Replace('__MGLIST__', ($mgDlls -join "`n"))
          $body = $body.Replace('__MSLIST__', ($msDlls -join "`n"))
          Set-Content -Path release-body.md -Value $body -Encoding UTF8
          "--- release-body.md ---" | Out-Host
          Get-Content release-body.md | Out-Host

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          # action-gh-release 必须有 tag，否则报 "GitHub Releases requires a tag"。
          # 版本号由上面的「计算下一个版本号」步骤从远端已有 v0.N 里推导，
          # 输出为 v0.N / v0.N+1 / ... 每次 main 推送递增一个版本。
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.name }}
          files: |
            MDQuickViewer-mingw64-x64.zip
            MDQuickViewer-msvc-x64.zip
          # 用 body_path 而非 body：导入表数字要读构建 job 落盘的文件才知道，
          # 无法在 YAML 里内联。body 和 body_path 只能给一个。
          body_path: release-body.md
