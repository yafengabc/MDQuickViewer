name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # MDQuickViewer 用 MSYS2 UCRT64 工具链（gcc + windres）
      # windres 由 mingw-w64-ucrt-x86_64-binutils 提供，没有独立的 windres 包。
      - name: 安装 MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-binutils

      - name: 构建并运行自检
        shell: msys2 {0}
        working-directory: MDQuickViewer
        run: |
          export PATH="/ucrt64/bin:$PATH"
          gcc --version | head -1
          ./build.sh test

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: MDQuickViewer
          path: |
            MDQuickViewer/build/MDQuickViewer.exe
            MDQuickViewer/build/sample.md
          if-no-files-found: error

  # MSVC + 静态 CRT（/MT）构建。
  # 目的不是替代 gcc，而是证明源码可移植、并且提供一个不带
  # api-ms-win-crt-* 转发器依赖的二进制选项。
  # 注意：Win32 系统 DLL（kernel32/user32/gdi32/comctl32/...）**无法**静态链接，
  # 微软不提供它们的静态库；/MT 只能把 C 运行时静态进 exe。
  msvc:
    runs-on: windows-latest
    # 允许失败：MSVC 路线是可选增量，挂了不影响 gcc 主线与 Release
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: 配置 MSVC 环境
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          # 把 cl/link/lib/rc/dumpbin 写进 GITHUB_PATH，后续 step 直接可用
          # （不指定 script 时该 action 会自动导出工具链环境）

      - name: 编译资源（rc.exe）
        shell: pwsh
        run: |
          cd MDQuickViewer
          New-Item -ItemType Directory -Force -Path build | Out-Null
          rc /nologo /fo build\mdqv.res resources\mdqv.rc

      - name: 编译（/MT 静态 CRT）
        shell: pwsh
        working-directory: MDQuickViewer
        run: |
          cl /nologo /W3 /O2 /std:c11 /MT /GS /DUNICODE /D_UNICODE `
            /D_CRT_SECURE_NO_WARNINGS /DWIN32_LEAN_AND_MEAN `
            /Fo:build\ /Fe:build\MDQuickViewer-msvc.exe `
            src\main.c src\win32.c src\markdown.c src\markdown_test.c `
            src\highlight.c src\highlight_test.c src\render.c src\render_test.c `
            src\settings.c src\dlg.c src\ui.c `
            build\mdqv.res `
            /link /SUBSYSTEM:WINDOWS /ENTRY:wWinMainCRTStartup `
            comctl32.lib gdi32.lib user32.lib shell32.lib shlwapi.lib comdlg32.lib ole32.lib uuid.lib

      - name: 验证导入表（静态 CRT 应无 api-ms-win-crt-*）
        shell: pwsh
        run: |
          $exe = "MDQuickViewer\build\MDQuickViewer-msvc.exe"
          if (-not (Test-Path $exe)) { throw "未生成 $exe" }
          $dump = & dumpbin /nologo /dependents $exe
          $dump | Write-Host
          $crt = $dump | Select-String 'api-ms-win-crt|vcruntime|ucrtbase'
          if ($crt) {
            Write-Host "注意：仍存在 CRT 动态依赖 -> $($crt -join ', ')"
          } else {
            Write-Host "OK: 无 CRT 动态依赖（/MT 静态链接生效）"
          }
          # Win32 系统 DLL 必然还在，这是预期行为（无法静态链接）
          Get-Item $exe | Select-Object Name, Length

      - name: 上传 MSVC 产物
        uses: actions/upload-artifact@v4
        with:
          name: MDQuickViewer-msvc
          path: MDQuickViewer/build/MDQuickViewer-msvc.exe
          if-no-files-found: warn

  # 每次 main 分支更新自动发一个 Release
  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-binutils

      - name: 构建发布版
        shell: msys2 {0}
        working-directory: MDQuickViewer
        run: |
          export PATH="/ucrt64/bin:$PATH"
          ./build.sh
          # 附带 sample.md，方便"双击即看"
          cp sample.md build/

      - name: 打包 zip
        shell: pwsh
        run: |
          Compress-Archive -Force `
            -Path MDQuickViewer/build/MDQuickViewer.exe, MDQuickViewer/build/sample.md `
            -DestinationPath MDQuickViewer-windows-x64.zip

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          # action-gh-release 必须有 tag，否则报 "GitHub Releases requires a tag"。
          # 用 `v<完整 SHA>` 作为滚动 tag：每次 main 推送都更新同一个 tag，
          # 不会堆积出一串 release。GitHub Actions 表达式不支持 substring()，
          # 所以 name 保持默认（就用 tag 名），不自己拼短 SHA。
          tag_name: v${{ github.sha }}
          files: MDQuickViewer-windows-x64.zip
          generate_release_notes: true
          body: |
            ## MDQuickViewer

            纯 C + Win32 API 的原生 Markdown 浏览器，单文件 exe，无需附带任何 DLL。

            - 解析 / 语法着色 / GDI 排版全部手写，不依赖 WebView、Electron
            - GFM：表格、任务列表、删除线、代码块着色
            - 自检 438 项（解析 96 / 着色 62 / 渲染 280）

            下载 `MDQuickViewer-windows-x64.zip`，解压后把 `.md` 文件拖到
            `MDQuickViewer.exe` 上即可打开。
